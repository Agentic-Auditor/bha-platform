[pytest]
# Default test discovery for the BHA Platform unit suite.
# test_bugfixes.py is a LIVE-server integration test (it POSTs to 127.0.0.1:5000
# at import time) so it is excluded from the default run. To run it, start the
# dev server and call it explicitly:  pytest tests/test_bugfixes.py
testpaths = tests
addopts = -q --ignore=tests/test_bugfixes.py
